<svg xmlns="http://www.w3.org/2000/svg" width="600" height="206" viewBox="0 0 600 206"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="598" height="204" rx="14" fill="#0D1117" stroke="#30363D"/><rect x="1" y="14" width="4" height="178" rx="2" fill="#2563EB"/><text style="animation:up .8s ease-out 0.00s both" x="28" y="40" font-size="17" font-weight="400" fill="#E6EDF3" text-anchor="start">I build machine learning systems end to end:</text><text style="animation:up .8s ease-out 0.35s both" x="28" y="68" font-size="17" font-weight="400" fill="#E6EDF3" text-anchor="start">preprocessing, feature engineering, training and</text><text style="animation:up .8s ease-out 0.70s both" x="28" y="96" font-size="17" font-weight="400" fill="#E6EDF3" text-anchor="start">evaluation.</text><text style="animation:up .8s ease-out 1.05s both" x="28" y="134" font-size="17" font-weight="400" fill="#E6EDF3" text-anchor="start">I treat projects as experiments: build, measure,</text><text style="animation:up .8s ease-out 1.40s both" x="28" y="162" font-size="17" font-weight="400" fill="#E6EDF3" text-anchor="start">iterate.</text></svg>