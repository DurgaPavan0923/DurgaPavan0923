<svg xmlns="http://www.w3.org/2000/svg" width="900" height="4" viewBox="0 0 900 4"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.gl{animation:sl 4s linear infinite}@keyframes sl{from{transform:translateX(0)}to{transform:translateX(1200px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g"><stop offset="0" stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></linearGradient><clipPath id="c"><rect width="900" height="4" rx="2"/></clipPath></defs><g clip-path="url(#c)"><rect width="900" height="4" fill="#2563EB" fill-opacity=".25"/><rect class="gl" x="-300" width="300" height="4" fill="url(#g)"/></g></svg>