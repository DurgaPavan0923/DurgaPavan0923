<svg xmlns="http://www.w3.org/2000/svg" width="600" height="56" viewBox="0 0 600 56"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.r{animation:rot 9.600000000000001s linear infinite backwards}@keyframes rot{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:none}29.33%{opacity:1;transform:none}33.33%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.r:nth-of-type(n+2){display:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="598" height="54" rx="28" fill="#0D1117" stroke="#2563EB" stroke-width="1.5"/><g><text class="r" style="animation-delay:0.0s" x="300.0" y="35" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="middle">Deep Learning · NLP · Recommender Systems</text><text class="r" style="animation-delay:3.2s" x="300.0" y="35" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="middle">Predictive Modeling &amp; Data Science</text><text class="r" style="animation-delay:6.4s" x="300.0" y="35" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="middle">AI Research &amp; System Design</text></g></svg>