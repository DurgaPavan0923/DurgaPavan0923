<svg xmlns="http://www.w3.org/2000/svg" width="170" height="44" viewBox="0 0 170 44"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.glow{animation:gl 2.4s ease-in-out infinite}@keyframes gl{0%,100%{stroke-opacity:.2}50%{stroke-opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><rect class="glow" x="1.5" y="1.5" width="167" height="41" rx="21" fill="url(#g)" stroke="#58A6FF" stroke-width="2"/><text x="85.0" y="28" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">LinkedIn</text></svg>