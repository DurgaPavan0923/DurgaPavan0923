<svg xmlns="http://www.w3.org/2000/svg" width="182" height="48" viewBox="0 0 182 48"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.sh{animation:sh 3.5s ease-in-out infinite}@keyframes sh{from{transform:translateX(0)}to{transform:translateX(282px)}}.dot{animation:pulse 1.6s ease-in-out infinite}.tx{animation:up .8s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="s"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect width="182" height="48" rx="24"/></clipPath></defs><g clip-path="url(#c)"><rect width="182" height="48" fill="url(#g)"/><rect class="sh" x="-90" width="80" height="48" fill="url(#s)"/></g><circle class="dot" cx="26" cy="24" r="5" fill="#fff"/><text class="tx" x="44" y="31" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Connect</text></svg>