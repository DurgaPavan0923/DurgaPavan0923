<svg xmlns="http://www.w3.org/2000/svg" width="600" height="234" viewBox="0 0 600 234"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.gl{animation:sl 4.5s linear infinite}@keyframes sl{from{transform:translateX(0)}to{transform:translateX(860px)}}.dot{animation:pulse 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g"><stop offset="0" stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="1" y="1" width="598" height="232" rx="14"/></clipPath></defs><rect x="1" y="1" width="598" height="232" rx="14" fill="#0D1117" stroke="#30363D"/><g clip-path="url(#c)"><rect class="gl" x="-260" width="260" height="3" y="1" fill="url(#g)"/></g><circle class="dot" cx="574" cy="28" r="5" fill="#58A6FF"/><text style="animation:up .8s ease-out 0.2s both" x="28" y="40" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Recommendation System</text><g style="animation:up .8s ease-out 0.35s both"><rect x="28.0" y="54" width="192.2" height="24" rx="12" fill="#1E3A8A"/><text x="124.1" y="70" font-size="12" font-weight="600" fill="#DBEAFE" text-anchor="middle">Collaborative filtering</text></g><g style="animation:up .8s ease-out 0.35s both"><rect x="228.2" y="54" width="118.2" height="24" rx="12" fill="#1E3A8A"/><text x="287.3" y="70" font-size="12" font-weight="600" fill="#DBEAFE" text-anchor="middle">Content-based</text></g><g style="animation:up .8s ease-out 0.35s both"><rect x="354.4" y="54" width="155.2" height="24" rx="12" fill="#1E3A8A"/><text x="432.0" y="70" font-size="12" font-weight="600" fill="#DBEAFE" text-anchor="middle">Similarity metrics</text></g><text style="letter-spacing:1px;animation:up .8s ease-out 0.5s both" x="28" y="108" font-size="11" font-weight="700" fill="#58A6FF" text-anchor="start">PROBLEM</text><text style="animation:up .8s ease-out 0.55s both" x="28" y="128" font-size="14.5" font-weight="400" fill="#C9D1D9" text-anchor="start">Suggest relevant items to users from their past interactions.</text><text style="letter-spacing:1px;animation:up .8s ease-out 0.65s both" x="28" y="162" font-size="11" font-weight="700" fill="#58A6FF" text-anchor="start">APPROACH</text><text style="animation:up .8s ease-out 0.7000000000000001s both" x="28" y="182" font-size="14.5" font-weight="400" fill="#C9D1D9" text-anchor="start">Collaborative and content-based filtering using a user-item</text><text style="animation:up .8s ease-out 0.7000000000000001s both" x="28" y="202" font-size="14.5" font-weight="400" fill="#C9D1D9" text-anchor="start">matrix and similarity metrics, with optimization.</text></svg>